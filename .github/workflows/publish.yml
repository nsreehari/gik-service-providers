name: Publish to npm
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable release against protected main
        if: github.event_name == 'release'
        id: release
        env:
          TAG: ${{ github.event.release.tag_name }}
          IS_DRAFT: ${{ github.event.release.draft }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          test "$IS_DRAFT" = false
          if [ "$IS_PRERELEASE" = true ]; then
            [[ "$TAG" =~ ^npm-next-[0-9]{4}-[0-9]{2}-[0-9]{2}\.[1-9][0-9]*$ ]]
            echo "channel=next" >> "$GITHUB_OUTPUT"
          else
            [[ "$TAG" =~ ^npm-[0-9]{4}-[0-9]{2}-[0-9]{2}\.[1-9][0-9]*$ ]]
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          fi
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: source
    uses: ./.github/workflows/ci.yml
  publish:
    if: github.event_name == 'release'
    needs: [source, validate]
    runs-on: ubuntu-latest
    environment: npm-publish
    concurrency:
      group: npm-publication
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_MANIFEST_SHA256: ${{ needs.validate.outputs.digest }}
      RELEASE_CHANNEL: ${{ needs.source.outputs.channel }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck release tag before publication
        env:
          TAG: ${{ github.event.release.tag_name }}
          EXPECTED_SHA: ${{ needs.source.outputs.commit }}
        run: |
          git fetch origin "refs/tags/$TAG"
          test "$(git rev-parse FETCH_HEAD^{commit})" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.0 --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: gik-npm-release
          path: .artifacts/npm-release
      - run: npm run release:publish-artifacts
  verify-published:
    name: Verify published package
    needs: [source, validate, publish]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_MANIFEST_SHA256: ${{ needs.validate.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0 --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: gik-npm-release
          path: .artifacts/npm-release
      - run: npm run release:verify-published
  notify-samples:
    name: Refresh Samples after verified stable publication
    needs: [source, verify-published]
    if: github.event_name == 'release' && needs.source.outputs.channel == 'latest'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create Samples-only maintainer App token
        id: samples
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GIK_MAINTAINER_APP_ID }}
          private-key: ${{ secrets.GIK_MAINTAINER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: gik-samples
          permission-contents: write
      - name: Request verified latest Pages and vendor refresh
        env:
          GH_TOKEN: ${{ steps.samples.outputs.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          SOURCE_RUN: ${{ github.run_id }}
          SOURCE_TAG: ${{ github.event.release.tag_name }}
        run: |
          jq -n --arg repository "$SOURCE_REPOSITORY" --arg commit "$SOURCE_COMMIT" \
            --arg runId "$SOURCE_RUN" --arg tag "$SOURCE_TAG" \
            '{event_type:"gik-library-release-verified",client_payload:{repository:$repository,commit:$commit,runId:$runId,tag:$tag}}' \
            | gh api repos/nsreehari/gik-samples/dispatches --input -
