name: CI
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      digest:
        description: SHA-256 of the inspected package archive
        value: ${{ jobs.validate.outputs.digest }}
permissions:
  contents: read
jobs:
  locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Resolve reproducible lock without scripts or manifest changes
        run: |
          npm exec --yes --package=npm@11.19.0 -- npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- . ':!package-lock.json'
          echo "Source: $(git rev-parse HEAD)"
          sha256sum package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: package-lock.json
          if-no-files-found: error
  validate:
    needs: locks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Require the reviewed committed lock
        run: git ls-files --error-unmatch package-lock.json
      - name: Install and validate without changing lock
        run: |
          npm exec --yes --package=npm@11.19.0 -- npm install --no-audit --no-fund
          git diff --exit-code -- package-lock.json
          npm run build
          npm run typecheck
          npm test
      - name: Inspect and exercise actual packed consumer
        id: pack
        run: npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: package-candidate
          path: .artifacts/package
          if-no-files-found: error
