name: CI
on:
  pull_request:
  workflow_dispatch:
    inputs:
      generate_locks:
        description: Generate a reviewable lock only, not validation evidence
        type: boolean
        default: false
  workflow_call:
    outputs:
      digest:
        description: SHA-256 of the inspected release manifest
        value: ${{ jobs.validate.outputs.digest }}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  locks:
    if: github.event_name == 'workflow_dispatch' && inputs.generate_locks == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          npm exec --yes --package=npm@11.19.0 -- npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- . ':!package-lock.json'
          echo "Source: $(git rev-parse HEAD)"
          sha256sum package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: package-lock.json
          if-no-files-found: error
  validate:
    if: github.event_name != 'workflow_dispatch' || inputs.generate_locks != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.pack.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - name: Require committed lock and validate once
        run: |
          git ls-files --error-unmatch package-lock.json
          npm install --no-audit --no-fund
          git diff --exit-code -- package-lock.json
          npm run release:gate
      - name: Pack once without lifecycle rebuilding and exercise actual consumers
        id: pack
        run: npm run release:pack
      - uses: actions/upload-artifact@v4
        with:
          name: gik-npm-release
          path: .artifacts/npm-release
          if-no-files-found: error
          include-hidden-files: true
