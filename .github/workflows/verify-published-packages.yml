name: Verify published packages
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
      manifest_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  consume:
    name: Consume published packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.0 --no-audit --no-fund
      - uses: actions/download-artifact@v4
        if: github.event_name == 'release'
        with:
          name: gik-npm-release
          path: .artifacts/npm-release
      - run: npm run release:verify-published
